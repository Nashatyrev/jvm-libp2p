<text x="24" y="36" font-size="22" font-weight="700" fill="#2c2c2a">Aggregates per wave — home group, by epoch length</text>
<text x="24" y="62" font-size="14" fill="#6b6a65">home group (100 nodes, 50 / 25 Mbit/s), measured slot; stream-Snappy, fixed peer graph</text>
<text x="24" y="81" font-size="14" fill="#6b6a65">1M validators, 2 of 64 attestation subnets per residential node; eth gossip D=8, 700 ms heartbeat</text>
<text x="24" y="100" font-size="14" fill="#6b6a65">1024 aggregates per slot at 6 / 8 / 9 / 10 / 11 s; bitvector grows as the epoch shortens</text>
