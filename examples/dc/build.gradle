// Decoupled Consensus (DC) simulations built on top of the QUIC simulator.
//
// Reusable simulation building blocks (network builders, node programs) live in `src/main/kotlin`;
// the scenarios that drive them are JUnit tests in `src/test/kotlin`, matching the style used by
// `:tools:quic-simulator` itself.
//
// Run everything:
//   ./gradlew :examples:dc:test
// Run a single scenario:
//   ./gradlew :examples:dc:test --tests "io.libp2p.example.dc.DcNetworkBuilderTest"

dependencies {
  implementation project(':tools:quic-simulator')

  implementation("io.netty:netty-handler")
  implementation("io.netty.incubator:netty-incubator-codec-classes-quic:0.0.76.Final-SNAPSHOT")
  // Scenario files. Plain YAML -> Map parsing; the overlay onto DcRunConfig defaults is hand-written
  // in DcRunConfigYaml so that unknown keys are rejected with a useful message.
  implementation("org.yaml:snakeyaml:1.33")

  testRuntimeOnly("org.apache.logging.log4j:log4j-slf4j2-impl")
}

test {
  // The simulator runs in virtual time but is CPU/heap hungry for larger node counts.
  maxHeapSize = '4g'
  // Scenario runs are studies, not tests: minutes to hours. Keep them out of the normal build.
  // "interop" repeats the root build's exclusion, since this call replaces those options.
  useJUnitPlatform {
    excludeTags("interop", "simulation")
  }
}

// Runs the scenario runners that `test` excludes:
//   ./gradlew :examples:dc:simulation
//   ./gradlew :examples:dc:simulation --tests "*attestation 1000 residential*"
tasks.register('simulation', Test) {
  description = 'Runs DC scenario runners (tagged "simulation").'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  // The 512 GB box is the real ceiling, and both halves of the split are binding at the top end.
  // A 1M-validator run at 300g/200g died with the heap 99.85% full and 427 full GCs; the same run
  // at 400g/60g left the heap at 56% but exhausted Netty's direct buffers. 330g/130g splits the
  // difference, keeping the total at 460g so G1's own structures still fit.
  // 330g/130g is the split every completed 1M run has used, including both two-slot runs with
  // aggregates. It sits at ~503 GB RSS on a 512 GB box, so there is no headroom to grow into:
  // runs that need more than this are killed outright by the OS, with no hs_err and no
  // OutOfMemoryError (JUnit records the test as skipped). Rebalancing heap against direct
  // buffers does not help, since the kernel sees only the sum -- a heavier run needs fewer
  // validators or fewer slots, not a different split.
  // -Ddc.heap=24g for a 64 GB machine: with a 330g ceiling the JVM barely collects and keeps
  // growing across the runs of a sweep until the OS kills it (exit 137).
  maxHeapSize = System.getProperty('dc.heap') ?: '330g'
  jvmArgs('-XX:MaxDirectMemorySize=' + (System.getProperty('dc.directMemory') ?: '130g'))
  // Lets a scenario be swept without editing it, e.g.
  //   ./gradlew :examples:dc:simulation --tests "*large network*" -Ddc.validators=100000
  ['dc.validators', 'dc.ffgCompression', 'dc.slots', 'dc.warmupSlots', 'dc.gossip', 'dc.ffg', 'dc.ethGossip', 'dc.homeDownMbps', 'dc.homeUpMbps', 'dc.iwant', 'dc.iwantScope', 'dc.homeFfgSubnets', 'dc.warmupFrom', 'dc.idontwant', 'dc.ffgSlots', 'dc.homeCount', 'dc.midHomeCount', 'dc.upperHomeCount', 'dc.homeValidators', 'dc.snappyStream', 'dc.ffgSnappyRatio', 'dc.aggSnappyRatio', 'dc.quicStatsAtMs', 'dc.attackFractions', 'dc.bandwidthsMbps', 'dc.messageKiB', 'dc.messagesPerSlot', 'dc.slowCount', 'dc.peers', 'dc.timelineDir', 'dc.slowMbps', 'dc.attackIHave', 'dc.attackSlots', 'dc.attackSeeds', 'dc.settleSeconds', 'dc.lanes', 'dc.controlLane', 'dc.poolCount', 'dc.seed', 'dc.ethSlotSimRun', 'dc.maxPublishedMessages', 'dc.unbatchedColumns', 'dc.goldfishVotes', 'dc.ptcVotes', 'libp2p.quic.maxSendUdpPayloadSize', 'libp2p.quic.localConnectionIdLength', 'libp2p.quic.hystart', 'libp2p.quic.cc', 'io.netty.incubator.codec.quic.pacing', 'io.netty.incubator.codec.quic.pacingStats', 'dc.queue', 'dc.queueTraces', 'dc.queueOut', 'dc.closedLoopOut', 'dc.closedLoopReceivers', 'dc.closedLoopVotes', 'libp2p.quic.initialCwndPackets', 'libp2p.quic.initialMaxStreamData', 'libp2p.quic.initialMaxData'].each { name ->
    if (System.getProperty(name) != null) {
      systemProperty name, System.getProperty(name)
    }
  }
  // Simulations run QUIC with quic-go-like settings unless told otherwise: go-libp2p's 32-packet initial
  // window and 1280-byte packets, 4-byte connection ids, and flow-control credit large enough to stand
  // in for quic-go's window auto-tuning (quiche's own growth stalls a cold 1 MiB transfer for several
  // RTTs). A -Dlibp2p.quic.* on the command line still wins; -Ddc.quicDefaults=quiche keeps quiche's
  // defaults instead. Only for these study runs: QuicTransport's own defaults are unchanged.
  if (System.getProperty('dc.quicDefaults') != 'quiche') {
    ['libp2p.quic.initialCwndPackets': '32',
     'libp2p.quic.initialMaxStreamData': '16777216',
     'libp2p.quic.initialMaxData': '33554432',
     'libp2p.quic.maxSendUdpPayloadSize': '1280',
     'libp2p.quic.localConnectionIdLength': '4'].each { name, value ->
      if (System.getProperty(name) == null) {
        systemProperty name, value
      }
    }
  }
  useJUnitPlatform {
    includeTags("simulation")
  }
  testLogging {
    showStandardStreams = true
  }
  outputs.upToDateWhen { false }
}
