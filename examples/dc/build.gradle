// Decoupled Consensus (DC) simulations built on top of the QUIC simulator.
//
// Reusable simulation building blocks (network builders, node programs) live in `src/main/kotlin`;
// the scenarios that drive them are JUnit tests in `src/test/kotlin`, matching the style used by
// `:tools:quic-simulator` itself.
//
// Run everything:
//   ./gradlew :examples:dc:test
// Run a single scenario:
//   ./gradlew :examples:dc:test --tests "io.libp2p.example.dc.DcNetworkBuilderTest"

dependencies {
  implementation project(':tools:quic-simulator')

  implementation("io.netty:netty-handler")
  // Scenario files. Plain YAML -> Map parsing; the overlay onto DcRunConfig defaults is hand-written
  // in DcRunConfigYaml so that unknown keys are rejected with a useful message.
  implementation("org.yaml:snakeyaml:1.33")

  testRuntimeOnly("org.apache.logging.log4j:log4j-slf4j2-impl")
}

test {
  // The simulator runs in virtual time but is CPU/heap hungry for larger node counts.
  maxHeapSize = '4g'
  // Scenario runs are studies, not tests: minutes to hours. Keep them out of the normal build.
  // "interop" repeats the root build's exclusion, since this call replaces those options.
  useJUnitPlatform {
    excludeTags("interop", "simulation")
  }
}

// Runs the scenario runners that `test` excludes:
//   ./gradlew :examples:dc:simulation
//   ./gradlew :examples:dc:simulation --tests "*attestation 1000 residential*"
tasks.register('simulation', Test) {
  description = 'Runs DC scenario runners (tagged "simulation").'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  maxHeapSize = '300g'
  jvmArgs('-XX:MaxDirectMemorySize=200g')
  useJUnitPlatform {
    includeTags("simulation")
  }
  testLogging {
    showStandardStreams = true
  }
  outputs.upToDateWhen { false }
}
